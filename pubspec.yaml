name: kaajlagbe
description: "KaajLagbe - Verified labour finding and booking marketplace."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Backend & Database
  supabase_flutter: ^2.8.4

  # Styling & Typography (Stitch MCP Kinetic Trust Design System)
  google_fonts: ^6.2.1

  # Environment Configuration
  flutter_dotenv: ^5.2.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/branding/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E83E4D"
  adaptive_icon_foreground: "assets/branding/app_logo_foreground.png"
  web:
    generate: true
    image_path: "assets/branding/app_logo.png"
    background_color: "#F8F9FA"
    theme_color: "#E83E4D"

flutter_native_splash:
  color: "#F8F9FA"
  image: "assets/branding/splash_logo.png"
  color_dark: "#121C2A"
  image_dark: "assets/branding/splash_logo.png"
  android_12:
    color: "#F8F9FA"
    image: "assets/branding/splash_logo.png"
    icon_background_color: "#E83E4D"
  web: true

