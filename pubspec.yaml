name: kaajlagbe
description: "KaajLagbe - Verified labour finding and booking marketplace."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Backend & Database
  supabase_flutter: ^2.8.4

  # Styling & Typography (Stitch MCP Kinetic Trust Design System)
  google_fonts: ^6.2.1

  # Environment Configuration
  flutter_dotenv: ^5.2.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
